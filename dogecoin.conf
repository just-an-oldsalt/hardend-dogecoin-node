# =============================================================================
# Dogecoin Core configuration - hardened-dogecoin-node
# =============================================================================
#
# This file lives at /etc/dogecoin/dogecoin.conf and is read by dogecoind on
# startup. Anything passed on the command line (see ExecStart= in
# dogecoind.service) overrides settings in this file.
#
# Reference: https://github.com/dogecoin/dogecoin/blob/master/doc/dogecoin-conf.md
#
# =============================================================================

# -----------------------------------------------------------------------------
# RPC authentication
# -----------------------------------------------------------------------------
# Username and password used by dogecoin-cli and any RPC client. By default
# the RPC server only listens on 127.0.0.1, so these credentials never leave
# the host - but you should still set a strong, unique password before going
# live. Generate one with:
#
#     openssl rand -base64 32
#
# For multi-user setups, prefer `rpcauth=` (hashed credentials) over plain
# `rpcuser` / `rpcpassword`. See the rpcauth.py helper in the Dogecoin repo.
rpcuser=user
rpcpassword=CHANGE_ME_BEFORE_FIRST_START

# Only accept RPC connections from the local host. Remove this line (and add
# `rpcbind=` + the trusted IPs to `rpcallowip=`) if you really need remote
# RPC, but understand the risk: anyone who reaches this port with the
# password owns your wallet.
rpcallowip=127.0.0.1

# -----------------------------------------------------------------------------
# Performance / resource sizing
# -----------------------------------------------------------------------------
# In-memory UTXO/database cache, in MB. Bigger = faster initial sync, but
# uses more RAM. Keep this in sync with MemoryMax= in dogecoind.service.
dbcache=1024

# Maximum size of the unconfirmed-transaction mempool, in MB. 500 is generous;
# lower it on memory-constrained hosts.
maxmempool=500

# -----------------------------------------------------------------------------
# Daemon / RPC mode
# -----------------------------------------------------------------------------
# Fork into the background on start. The systemd unit also passes -daemon
# explicitly via ExecStart= - either alone is enough, both is harmless.
daemon=1

# Enable the JSON-RPC server so dogecoin-cli and other tools can talk to us.
server=1

# -----------------------------------------------------------------------------
# Indexing
# -----------------------------------------------------------------------------
# Maintain a full transaction index. Required if you want to look up any
# historical txid via getrawtransaction, run a block explorer, or build
# tooling on top of the node. Costs extra disk (~tens of GB) and slows
# initial sync slightly. Disable (txindex=0) if you only need wallet-level
# data.
txindex=1

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# Where the blockchain, chainstate, wallet, and indexes live. Pick a path
# on a disk with at least 50 GB free.
#
# NOTE: dogecoind.service passes -datadir= on the command line, which takes
# precedence over this value. If you change this, change the unit too.
datadir=/mnt/data/doge/
